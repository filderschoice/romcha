<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="t d" font-family="'Hiragino Sans','Yu Gothic UI','Noto Sans JP','Noto Sans CJK JP',Meiryo,sans-serif">
  <title id="t">Screen preview</title>
  <desc id="d">An illustration of a semi-transparent chat window over a video app’s playback screen, with chat scrolling in sync with the video position. The video, author names and chat are all fictional, and this is not a real screen.</desc>
  <!-- 図解（実機のスクリーンショットではない）。動画・名前・チャット本文はすべて架空のダミー。BL-061 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5b7a"/>
      <stop offset="1" stop-color="#e0a574"/>
    </linearGradient>
    <clipPath id="screen"><rect x="20" y="24" width="320" height="672" rx="26"/></clipPath>
  </defs>
  <rect x="4" y="4" width="352" height="712" rx="40" fill="#0f1417" stroke="#37474F" stroke-width="4"/>
  <g clip-path="url(#screen)">
    <rect x="20" y="24" width="320" height="672" fill="#1c2327"/>
    <!-- ステータスバー -->
    <text x="38" y="46" font-size="10" fill="#90a4ae">12:34</text>
    <rect x="296" y="38" width="22" height="9" rx="2" fill="#90a4ae"/>
    <!-- 動画の再生領域（架空の風景） -->
    <rect x="20" y="64" width="320" height="180" fill="url(#sky)"/>
    <circle cx="258" cy="150" r="22" fill="#ffd9a8" opacity=".9"/>
    <path d="M20 244 L20 200 L90 150 L150 205 L215 160 L340 230 L340 244Z" fill="#24384a" opacity=".85"/>
    <path d="M20 244 L20 222 L70 196 L130 232 L190 206 L340 244Z" fill="#162330"/>
    <circle cx="180" cy="154" r="22" fill="#000" opacity=".35"/>
    <path d="M173 143 l20 11 -20 11z" fill="#fff" opacity=".9"/>
    <!-- シークバー（約 15% 付近） -->
    <rect x="20" y="240" width="320" height="4" fill="#fff" opacity=".25"/>
    <rect x="20" y="240" width="48" height="4" fill="#ff5252"/>
    <circle cx="68" cy="242" r="5" fill="#ff5252"/>
    <!-- 動画の情報 -->
    <text x="34" y="272" font-size="13" font-weight="700" fill="#eceff1">Sample stream archive (illustration)</text>
    <text x="34" y="290" font-size="10" fill="#90a4ae">Sample channel ・ fictional video</text>
    <rect x="34" y="304" width="292" height="44" rx="10" fill="#263238"/>
    <rect x="46" y="316" width="130" height="8" rx="4" fill="#455a64"/>
    <rect x="46" y="332" width="90" height="6" rx="3" fill="#37474f"/>
    <rect x="34" y="358" width="292" height="44" rx="10" fill="#263238"/>
    <rect x="46" y="370" width="150" height="8" rx="4" fill="#455a64"/>
    <rect x="46" y="386" width="100" height="6" rx="3" fill="#37474f"/>

    <!-- フローティングのチャットウィンドウ -->
    <g transform="translate(30 330)">
      <rect width="300" height="330" rx="14" fill="#0b0f12" opacity=".78"/>
      <rect width="300" height="30" rx="14" fill="#37474F" opacity=".95"/>
      <rect y="16" width="300" height="14" fill="#37474F" opacity=".95"/>
      <circle cx="16" cy="15" r="5" fill="#26a69a"/>
      <text x="28" y="19" font-size="11" font-weight="700" fill="#eceff1">Romcha</text>
      <rect x="76" y="7" width="76" height="16" rx="8" fill="#26a69a" opacity=".25"/>
      <text x="84" y="19" font-size="9" fill="#80cbc4">Syncing 0:12:34</text>
      <rect x="254" y="14" width="10" height="2" rx="1" fill="#cfd8dc"/>
      <path d="M274 10 l9 9 m0 -9 l-9 9" stroke="#cfd8dc" stroke-width="1.6" stroke-linecap="round" fill="none"/>

      <!-- チャット行 -->
      <g font-size="10.5">
        <circle cx="18" cy="52" r="8" fill="#66bb6a"/><text x="18" y="56" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">A</text>
        <text x="32" y="50" font-size="9" fill="#81c784">Viewer A <tspan fill="#78909c">0:12:20</tspan></text>
        <text x="32" y="63" fill="#eceff1">Hi, nice to meet you!</text>

        <circle cx="18" cy="86" r="8" fill="#64b5f6"/><text x="18" y="90" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">B</text>
        <text x="32" y="84" font-size="9" fill="#90caf9">Viewer B <tspan fill="#78909c">0:12:24</tspan></text>
        <text x="32" y="97" fill="#eceff1">Beautiful sunset</text>

        <circle cx="18" cy="120" r="8" fill="#ba68c8"/><text x="18" y="124" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">C</text>
        <text x="32" y="118" font-size="9" fill="#ce93d8">Viewer C <tspan fill="#78909c">0:12:27</tspan></text>
        <text x="32" y="131" fill="#eceff1">8888888888</text>
      </g>

      <!-- スーパーチャット（上位チャット） -->
      <rect x="8" y="146" width="284" height="56" rx="8" fill="#1e88e5"/>
      <rect x="8" y="146" width="284" height="24" rx="8" fill="#1565c0"/>
      <rect x="8" y="158" width="284" height="12" fill="#1565c0"/>
      <circle cx="24" cy="158" r="9" fill="#ffca28"/><text x="24" y="162" font-size="10" text-anchor="middle" fill="#0b0f12" font-weight="700">D</text>
      <text x="40" y="156" font-size="9.5" font-weight="700" fill="#fff">Viewer D</text>
      <text x="40" y="167" font-size="9" fill="#e3f2fd">¥500</text>
      <text x="250" y="162" font-size="9" fill="#e3f2fd">0:12:30</text>
      <text x="18" y="190" font-size="10.5" fill="#fff">Cheering you on!</text>

      <g font-size="10.5">
        <circle cx="18" cy="224" r="8" fill="#ffd54f"/><text x="18" y="228" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">E</text>
        <text x="32" y="222" font-size="9" fill="#fff176">Viewer E <tspan fill="#78909c">0:12:31</tspan></text>
        <text x="32" y="235" fill="#eceff1">Great song</text>

        <circle cx="18" cy="258" r="8" fill="#4db6ac"/><text x="18" y="262" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">F</text>
        <text x="32" y="256" font-size="9" fill="#80cbc4">Viewer F <tspan fill="#78909c">0:12:33</tspan></text>
        <text x="32" y="269" fill="#eceff1">Love this part</text>

        <circle cx="18" cy="292" r="8" fill="#ff8a65"/><text x="18" y="296" font-size="9" text-anchor="middle" fill="#0b0f12" font-weight="700">G</text>
        <text x="32" y="290" font-size="9" fill="#ffab91">Viewer G <tspan fill="#78909c">0:12:34</tspan></text>
        <text x="32" y="303" fill="#eceff1">Want to watch again</text>
      </g>
      <!-- リサイズのつまみ -->
      <path d="M290 322 l6 0 0 -6z" fill="#cfd8dc" opacity=".8"/>
    </g>
  </g>
</svg>
