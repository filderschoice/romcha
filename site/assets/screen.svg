    <rect x="130" y="10" width="10" height="10" rx="2" fill="#cfd8dc" opacity=".8"/>
    <rect x="150" y="10" width="10" height="10" rx="2" fill="#cfd8dc" opacity=".8"/>
    <g fill="#eceff1">
      <rect x="10" y="44" width="36" height="7" rx="3.5" fill="#81c784"/><rect x="52" y="44" width="100" height="7" rx="3.5"/>
      <rect x="10" y="62" width="30" height="7" rx="3.5" fill="#90caf9"/><rect x="46" y="62" width="80" height="7" rx="3.5"/>
      <rect x="10" y="80" width="40" height="7" rx="3.5" fill="#b0bec5"/><rect x="56" y="80" width="104" height="7" rx="3.5"/>
      <rect x="10" y="98" width="34" height="7" rx="3.5" fill="#b0bec5"/><rect x="50" y="98" width="70" height="7" rx="3.5"/>
