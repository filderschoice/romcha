<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-labelledby="t d">
  <title id="t">画面イメージ</title>
  <desc id="d">動画アプリの上に、半透明のチャットウィンドウが重なって表示されている様子の図解。実際の画面ではありません。</desc>
  <!-- 図解（実機のスクリーンショットではない）。差し替えは BL-061 -->
  <rect x="4" y="4" width="352" height="712" rx="40" fill="#0f1417" stroke="#37474F" stroke-width="4"/>
  <rect x="20" y="24" width="320" height="672" rx="26" fill="#1c2327"/>
  <!-- 動画の再生領域 -->
  <rect x="20" y="92" width="320" height="180" fill="#2b353b"/>
  <path d="M168 160 l32 22 -32 22z" fill="#90a4ae"/>
  <rect x="36" y="252" width="200" height="4" rx="2" fill="#26a69a"/>
  <rect x="36" y="252" width="288" height="4" rx="2" fill="#90a4ae" opacity=".3"/>
  <!-- 動画の情報（ぼかした行） -->
  <rect x="36" y="292" width="240" height="14" rx="7" fill="#37474f"/>
  <rect x="36" y="316" width="160" height="10" rx="5" fill="#37474f" opacity=".7"/>
  <rect x="36" y="360" width="288" height="60" rx="12" fill="#263238"/>
  <rect x="36" y="432" width="288" height="60" rx="12" fill="#263238"/>
  <rect x="36" y="504" width="288" height="60" rx="12" fill="#263238"/>
